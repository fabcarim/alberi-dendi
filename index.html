<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberi - Logic Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <header>
            <h1 id="main-title">Alberi Daily 🌲</h1>
            <p id="main-subtitle">Un nuovo puzzle ogni giorno!</p>
            <div id="daily-info" style="display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin-top: 0.5rem; background: #f8f9fa; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #eee; flex-wrap: wrap;">
                <span id="date-display" style="display: none;"></span>
                <label for="archive-date" id="archive-label" style="cursor: pointer; font-size: 1.2rem;" title="Archivio: scegli una data">📅</label>
                <input type="date" id="archive-date" style="padding: 0.3rem; border-radius: 4px; border: 1px solid #ccc; font-family: inherit;">
                <span id="timer-display" style="font-weight: bold; margin-left: 0.5rem;">00:00</span>
            </div>
        </header>

        <div class="game-controls">
            <div id="size-selector"
                style="margin-bottom: 1rem; width: 100%; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <!-- Buttons generated by JS -->
            </div>

            <button id="btn-check" class="btn primary">Controlla</button>
            <button id="btn-reset" class="btn secondary">Ricomincia</button>
            <button id="btn-training" class="btn secondary" style="background-color: #9b59b6; color: white; border-color: #9b59b6;">Allenamento Libero</button>
        </div>

        <div id="share-container" style="display: none; margin-bottom: 1rem;">
            <input type="text" id="username-input" placeholder="Il tuo nome" maxlength="15"
                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
            <button id="btn-share" class="btn primary" style="background-color: #3498db;">Condividi Risultato
                📤</button>
        </div>

        <div class="game-status" id="status-msg">Posiziona gli alberi: 1 per righe, colonne e aree colorate.</div>

        <main class="board-container" id="board">
            <!-- Grid generated by JS -->
        </main>

        <div class="rules-hint">
            <p><strong>Regole:</strong> Clicca per ciclare: Croce <span class="icon">❌</span> -> Albero <span
                    class="icon">🌳</span> -> Vuoto.</p>
            <p>Su PC puoi usare il Tasto Destro per mettere subito l'Erba.</p>
            <p>Non posizionare alberi adiacenti (neanche in diagonale).</p>
        </div>

        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="utils.js"></script>
    <script src="levels.js"></script>
    <script src="generator.js"></script>
    <script src="script.js"></script>
</body>

</html>
