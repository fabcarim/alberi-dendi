<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberi - Logic Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <header>
            <h1>Alberi Daily 🌲</h1>
            <p>Un nuovo puzzle ogni giorno!</p>
            <div id="daily-info">
                <span id="date-display"></span>
                <span id="timer-display">00:00</span>
            </div>
        </header>

        <div class="game-controls">
            <div id="size-selector"
                style="margin-bottom: 1rem; width: 100%; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <!-- Buttons generated by JS -->
            </div>

            <button id="btn-check" class="btn primary">Controlla</button>
            <button id="btn-reset" class="btn secondary">Ricomincia</button>
        </div>

        <div id="share-container" style="display: none; margin-bottom: 1rem;">
            <input type="text" id="username-input" placeholder="Il tuo nome" maxlength="15"
                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
            <button id="btn-share" class="btn primary" style="background-color: #3498db;">Condividi Risultato
                📤</button>
        </div>

        <div class="game-status" id="status-msg">Posiziona gli alberi: 1 per righe, colonne e aree colorate.</div>

        <main class="board-container" id="board">
            <!-- Grid generated by JS -->
        </main>

        <div class="rules-hint">
            <p><strong>Regole:</strong> Clic sinistro = Albero <span class="icon">🌳</span> | Clic destro = Erba <span
                    class="icon">❌</span></p>
            <p>Non posizionare alberi adiacenti (neanche in diagonale).</p>
        </div>

        <footer>
            <p>Developed with AI. Idea originale &copy; Giorgio Dendi.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="utils.js"></script>
    <script src="levels.js"></script>
    <script src="generator.js"></script>
    <script src="script.js"></script>
</body>

</html>
